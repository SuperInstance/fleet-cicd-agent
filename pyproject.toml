[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-cicd-agent"
version = "0.1.0"
description = "Fleet CI/CD Agent — automating deployments across agent fleets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "SuperInstance"}]
keywords = ["cicd", "fleet", "deployment", "pipeline", "rollback"]

[tool.setuptools.packages.find]
include = ["fleet_cicd_agent*"]
